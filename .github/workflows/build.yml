name: Build and Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK for Release
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/CryptoCalculator.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto-calculator-apk
          path: app/build/outputs/apk/debug/CryptoCalculator.apk

      - name: Create Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Crypto Calculator v1.0.${{ github.run_number }}"
          body: "Direct public download for the Crypto Calculator APK."
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/CryptoCalculator.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
